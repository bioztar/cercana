<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const def = [true, true, true, false, false];
    const on = s.on || def;
    const v = { changed: on.some((x, i) => x !== def[i]) };
    on.forEach((x, i) => {
      v['p' + i] = x ? 'true' : 'false';
      v['c' + i] = x ? '#A34A24' : '#FFFFFF';
      v['k' + i] = x ? '2px solid #A34A24' : '2px solid #C9BBA6';
      v['t' + i] = () => { const n = on.slice(); n[i] = !n[i]; this.setState({ on: n }); };
    });
    v.reset = () => this.setState({ on: def });
    return v;
  }
}
</script>
