</span>
<button type="button" aria-label="Say the caption again" style="width: 48px; height: 48px; flex-shrink: 0; border: 2px solid #A34A24; border-radius: 24px; background: #FFFFFF; color: #A34A24; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0"></path><path d="M12 18v3"></path></svg></button>

<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 17px; font-weight: 700; color: #5E574E">Who can see it</span>
<button type="button" onClick="{{ pick0 }}" aria-pressed="{{ p0 }}" style="min-height: 56px; padding: 0 16px; border: {{ b0 }}; border-radius: 16px; background: #FFFFFF; font-family: inherit; font-size: 21px; font-weight: 700; color: #1F1B16; display: flex; align-items: center; justify-content: space-between; cursor: pointer; box-sizing: border-box">
<span>Whole family</span>
<span style="width: 30px; height: 30px; border-radius: 15px; background: {{ c0 }}; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span>
</button>
<button type="button" onClick="{{ pick1 }}" aria-pressed="{{ p1 }}" style="min-height: 56px; padding: 0 16px; border: {{ b1 }}; border-radius: 16px; background: #FFFFFF; font-family: inherit; font-size: 21px; font-weight: 700; color: #1F1B16; display: flex; align-items: center; justify-content: space-between; cursor: pointer; box-sizing: border-box">
<span>Andrey’s family</span>
<span style="width: 30px; height: 30px; border-radius: 15px; background: {{ c1 }}; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span>
</button>
<button type="button" onClick="{{ pick2 }}" aria-pressed="{{ p2 }}" style="min-height: 56px; padding: 0 16px; border: {{ b2 }}; border-radius: 16px; background: #FFFFFF; font-family: inherit; font-size: 21px; font-weight: 700; color: #1F1B16; display: flex; align-items: center; justify-content: space-between; cursor: pointer; box-sizing: border-box">
<span>Maxim</span>
<span style="width: 30px; height: 30px; border-radius: 15px; background: {{ c2 }}; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span>
</button>

<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12l16-8-6 16-3-7z"></path></svg>
<span>Send</span>
</a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const a = s.aud ?? 0;
    const on = (i) => a === i;
    const v = {};
    [0, 1, 2].forEach((i) => {
      v['p' + i] = on(i) ? 'true' : 'false';
      v['b' + i] = on(i) ? '3px solid #A34A24' : '2px solid #E4DACB';
      v['c' + i] = on(i) ? '#A34A24' : '#E4DACB';
      v['pick' + i] = () => this.setState({ aud: i });
    });
    return v;
  }
}
</script>
