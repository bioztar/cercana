<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Important event for Mom</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&amp;family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Atkinson Hyperlegible',system-ui,sans-serif;background:#F7F3EC;color:#1F1B16}
a{color:#A34A24}a:hover{color:#7E3719}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F7F3EC; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; color: #1F1B16; overflow: hidden">
<div style="padding: 52px 16px 12px 16px; display: flex; flex-direction: column; gap: 4px; border-bottom: 1px solid #E4DACB">
<a href="#calendar" style="display: flex; align-items: center; gap: 6px; min-height: 48px; width: 160px; font-size: 20px; font-weight: 700; text-decoration: none; color: #A34A24"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg><span>Cancel</span></a>
<h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 30px; line-height: 1.2">New event</h1>
</div>
<div style="flex-grow: 1; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; overflow: hidden">
<div style="background: #FFFFFF; border-radius: 20px; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 22px; font-weight: 700">Cardiologist appointment</span>
<span style="font-size: 18px; color: #5E574E">Tuesday, September 29, 10:30 AM</span>
<div style="min-height: 52px; border-top: 1px solid #EDE5D8; padding-top: 8px; display: flex; align-items: center; gap: 10px">
<span style="font-size: 18px; color: #5E574E">For</span>
<span style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 18px; background: #DDE8D5; color: #35562A; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center">M</span>
<span style="font-size: 19px; font-weight: 700; flex-grow: 1">Mom only</span>
<button type="button" style="min-height: 44px; padding: 0 4px; border: none; background: transparent; font-family: inherit; font-size: 17px; font-weight: 700; color: #A34A24; cursor: pointer">Edit</button>
</div>
</div>
<button type="button" onClick="{{ toggle }}" aria-pressed="{{ impP }}" style="min-height: 72px; padding: 10px 16px; border: {{ impBorder }}; border-radius: 20px; background: {{ impBg }}; font-family: inherit; color: #1F1B16; display: flex; align-items: center; gap: 12px; text-align: left; cursor: pointer; box-sizing: border-box">
<span style="display: flex; flex-direction: column; flex-grow: 1"><span style="font-size: 20px; font-weight: 700">Important event</span><span style="font-size: 16px; color: #5E574E">Reminders and a check-in afterwards</span></span>
<span style="width: 56px; height: 34px; flex-shrink: 0; border-radius: 17px; background: {{ swBg }}; display: flex; align-items: center; padding: 3px; box-sizing: border-box; justify-content: {{ swJust }}"><span style="width: 28px; height: 28px; border-radius: 14px; background: #FFFFFF"></span></span>
</button>
<sc-if value="{{ imp }}" hint-placeholder-val="{{ true }}">
<div style="background: #FFFFFF; border-radius: 20px; padding: 8px 16px 4px 16px; display: flex; flex-direction: column">
<span style="font-size: 17px; font-weight: 700; color: #5E574E; padding: 4px 0">Notifications to Mom</span>
<div style="min-height: 60px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #EDE5D8">
<span style="color: #5E574E; display: flex"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"></path><path d="M10 20a2 2 0 0 0 4 0"></path></svg></span>
<span style="display: flex; flex-direction: column; flex-grow: 1"><span style="font-size: 19px; font-weight: 700">The evening before</span><span style="font-size: 16px; color: #5E574E">Mon, Sep 28, 8:00 PM</span></span>
<span style="width: 32px; height: 32px; flex-shrink: 0; box-sizing: border-box; border-radius: 9px; background: #A34A24; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span>
</div>
<div style="min-height: 60px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #EDE5D8">
<span style="color: #5E574E; display: flex"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"></path><path d="M10 20a2 2 0 0 0 4 0"></path></svg></span>
<span style="display: flex; flex-direction: column; flex-grow: 1"><span style="font-size: 19px; font-weight: 700">On the day</span><span style="font-size: 16px; color: #5E574E">Tue, 8:00 AM</span></span>
<span style="width: 32px; height: 32px; flex-shrink: 0; box-sizing: border-box; border-radius: 9px; background: #A34A24; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span>
</div>
<div style="min-height: 60px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #EDE5D8">
<span style="color: #5E574E; display: flex"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M9.5 9.5a2.5 2.5 0 0 1 4.8 1c0 1.7-2.3 2-2.3 3.5M12 17v.5"></path></svg></span>
<span style="display: flex; flex-direction: column; flex-grow: 1"><span style="font-size: 19px; font-weight: 700">After: “Did you go?”</span><span style="font-size: 16px; color: #5E574E">Tue, 12:30 PM · you’ll see the answer</span></span>
<span style="width: 32px; height: 32px; flex-shrink: 0; box-sizing: border-box; border-radius: 9px; background: #A34A24; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span>
</div>
<button type="button" style="min-height: 52px; border: none; background: transparent; font-family: inherit; font-size: 18px; font-weight: 700; color: #A34A24; display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg><span>Add reminder</span></button>
</div>
</sc-if>
</div>
<div style="padding: 12px 16px 32px 16px; border-top: 1px solid #E4DACB; background: #F7F3EC">
<a href="ImpStatus.dc.html" style="min-height: 64px; background: #A34A24; color: #FFFFFF; border-radius: 32px; font-size: 22px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">Save</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const imp = s.imp ?? true;
    return {
      imp,
      impP: imp ? 'true' : 'false',
      impBorder: imp ? '3px solid #8E2A1C' : '2px solid #E4DACB',
      impBg: imp ? '#FCEFEC' : '#FFFFFF',
      swBg: imp ? '#8E2A1C' : '#C9BBA6',
      swJust: imp ? 'flex-end' : 'flex-start',
      toggle: () => this.setState({ imp: !imp })
    };
  }
}
</script>
</body>
</html>
