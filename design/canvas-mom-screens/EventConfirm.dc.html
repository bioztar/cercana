<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Check the event</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&amp;family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Atkinson Hyperlegible',system-ui,sans-serif;background:#F7F3EC;color:#1F1B16}
a{color:#A34A24}a:hover{color:#7E3719}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F7F3EC; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; color: #1F1B16; overflow: hidden">

<div style="padding: 52px 16px 12px 16px; display: flex; flex-direction: column; gap: 4px; border-bottom: 1px solid #E4DACB">
<a href="EventVoice.dc.html" style="display: flex; align-items: center; gap: 6px; min-height: 48px; width: 140px; font-size: 20px; font-weight: 700; text-decoration: none; color: #A34A24">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
<span>Back</span>
</a>
<h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 30px; line-height: 1.2">Does this look right?</h1>
</div>

<div style="flex-grow: 1; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; overflow: hidden">

<div style="background: #FFFFFF; border-radius: 20px; padding: 12px 16px; display: flex; align-items: center; gap: 12px">
<span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1">
<span style="font-size: 17px; font-weight: 700; color: #5E574E">What</span>
<span style="font-size: 22px; font-weight: 700">Trip to see relatives</span>
</span>
<button type="button" aria-label="Edit title" style="width: 48px; height: 48px; flex-shrink: 0; border: none; border-radius: 24px; background: #F7F3EC; color: #A34A24; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg></button>
</div>

<div style="background: #FFFFFF; border-radius: 20px; padding: 12px 16px 16px 16px; display: flex; flex-direction: column; gap: 10px">
<span style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 17px; font-weight: 700; color: #5E574E">When</span>
<span style="font-size: 22px; font-weight: 700">{{ when }}</span>
</span>
<div style="display: flex; flex-direction: column; gap: 8px">
<button type="button" onClick="{{ pick0 }}" aria-pressed="{{ p0 }}" style="min-height: 52px; padding: 0 14px; border: {{ b0 }}; border-radius: 14px; background: {{ f0 }}; font-family: inherit; font-size: 19px; font-weight: 700; color: #1F1B16; display: flex; align-items: center; justify-content: space-between; cursor: pointer; box-sizing: border-box"><span>This weekend</span><span style="font-weight: 400; color: #5E574E">26–27 Sep</span></button>
<button type="button" onClick="{{ pick1 }}" aria-pressed="{{ p1 }}" style="min-height: 52px; padding: 0 14px; border: {{ b1 }}; border-radius: 14px; background: {{ f1 }}; font-family: inherit; font-size: 19px; font-weight: 700; color: #1F1B16; display: flex; align-items: center; justify-content: space-between; cursor: pointer; box-sizing: border-box"><span>Next weekend</span><span style="font-weight: 400; color: #5E574E">3–4 Oct</span></button>
<button type="button" onClick="{{ pick2 }}" aria-pressed="{{ p2 }}" style="min-height: 52px; padding: 0 14px; border: {{ b2 }}; border-radius: 14px; background: {{ f2 }}; font-family: inherit; font-size: 19px; font-weight: 700; color: #1F1B16; display: flex; align-items: center; justify-content: space-between; cursor: pointer; box-sizing: border-box"><span>Another day</span><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5E574E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg></button>
</div>
</div>

<button type="button" style="min-height: 60px; padding: 0 16px; border: 2px dashed #C9BBA6; border-radius: 20px; background: transparent; font-family: inherit; font-size: 20px; font-weight: 700; color: #A34A24; display: flex; align-items: center; gap: 10px; cursor: pointer">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.5-7-12a7 7 0 0 1 14 0c0 5.5-7 12-7 12z"></path><circle cx="12" cy="9" r="2.5"></circle></svg>
<span>Add where you’re going</span>
</button>

<div style="background: #FFFFFF; border-radius: 20px; padding: 4px 16px; display: flex; flex-direction: column">
<div style="min-height: 60px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #EDE5D8">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#5E574E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20a6.5 6.5 0 0 1 13 0"></path><circle cx="17" cy="9" r="2.5"></circle><path d="M16 14.5a5 5 0 0 1 5.5 5.5"></path></svg>
<span style="flex-grow: 1; font-size: 19px">Who’s going</span>
<span style="width: 36px; height: 36px; border-radius: 18px; background: #DDE8D5; color: #35562A; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center">You</span>
<button type="button" aria-label="Add people" style="width: 44px; height: 44px; border: 2px dashed #C9BBA6; border-radius: 22px; background: #FFFFFF; color: #A34A24; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
</div>
<div style="min-height: 56px; display: flex; align-items: center; gap: 12px">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#5E574E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
<span style="flex-grow: 1; font-size: 19px">Who can see it</span>
<span style="font-size: 19px; font-weight: 700; color: #A34A24">Whole family</span>
</div>
</div>
</div>

<div style="padding: 12px 16px 32px 16px; border-top: 1px solid #E4DACB; background: #F7F3EC">
<a href="Calendar.dc.html" style="min-height: 64px; background: #A34A24; color: #FFFFFF; border-radius: 32px; font-size: 22px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">Save</a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const d = s.d ?? 1;
    const labels = ['Sat, Sep 26 – Sun, Sep 27', 'Sat, Oct 3 – Sun, Oct 4', 'Pick a day'];
    const v = { when: labels[d] };
    [0, 1, 2].forEach((i) => {
      v['p' + i] = d === i ? 'true' : 'false';
      v['b' + i] = d === i ? '3px solid #A34A24' : '2px solid #E4DACB';
      v['f' + i] = d === i ? '#FBEFE7' : '#FFFFFF';
      v['pick' + i] = () => this.setState({ d: i });
    });
    return v;
  }
}
</script>
</body>
</html>
