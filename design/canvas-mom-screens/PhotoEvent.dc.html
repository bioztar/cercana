<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Which event</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&amp;family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Atkinson Hyperlegible',system-ui,sans-serif;background:#F7F3EC;color:#1F1B16}
a{color:#A34A24}a:hover{color:#7E3719}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F7F3EC; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; color: #1F1B16; overflow: hidden">

<div style="padding: 52px 16px 12px 16px; display: flex; flex-direction: column; gap: 4px; border-bottom: 1px solid #E4DACB">
<a href="PhotoPick.dc.html" style="display: flex; align-items: center; gap: 6px; min-height: 48px; width: 140px; font-size: 20px; font-weight: 700; text-decoration: none; color: #A34A24">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
<span>Back</span>
</a>
<h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 30px; line-height: 1.2">Which event is this?</h1>
<p style="margin: 0; font-size: 18px; color: #5E574E">Optional · photos taken today</p>
</div>

<div style="flex-grow: 1; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; overflow: hidden">
<span style="font-size: 17px; font-weight: 700; color: #5E574E">Close to this date</span>

<button type="button" onClick="{{ pick0 }}" aria-pressed="{{ p0 }}" style="min-height: 64px; padding: 8px 12px; border: {{ b0 }}; border-radius: 16px; background: {{ f0 }}; font-family: inherit; color: #1F1B16; display: flex; align-items: center; gap: 12px; text-align: left; cursor: pointer; box-sizing: border-box">
<span style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 12px; background: #FBEFE7; color: #A34A24; display: flex; flex-direction: column; align-items: center; justify-content: center"><span style="font-size: 20px; font-weight: 700; line-height: 1">24</span><span style="font-size: 12px; font-weight: 700">SEP</span></span>
<span style="display: flex; flex-direction: column; gap: 1px; flex-grow: 1">
<span style="font-size: 20px; font-weight: 700">Walk in the park</span>
<span style="font-size: 16px; color: #5E574E">today · Yulia, Masha</span>
</span>
<span style="width: 28px; height: 28px; flex-shrink: 0; border-radius: 14px; border: {{ r0 }}; box-sizing: border-box"></span>
</button>

<button type="button" onClick="{{ pick1 }}" aria-pressed="{{ p1 }}" style="min-height: 64px; padding: 8px 12px; border: {{ b1 }}; border-radius: 16px; background: {{ f1 }}; font-family: inherit; color: #1F1B16; display: flex; align-items: center; gap: 12px; text-align: left; cursor: pointer; box-sizing: border-box">
<span style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 12px; background: #FBEFE7; color: #A34A24; display: flex; flex-direction: column; align-items: center; justify-content: center"><span style="font-size: 20px; font-weight: 700; line-height: 1">25</span><span style="font-size: 12px; font-weight: 700">SEP</span></span>
<span style="display: flex; flex-direction: column; gap: 1px; flex-grow: 1">
<span style="font-size: 20px; font-weight: 700">Yulia’s birthday</span>
<span style="font-size: 16px; color: #5E574E">tomorrow · Andrey, Yulia, Masha</span>
</span>
<span style="width: 28px; height: 28px; flex-shrink: 0; border-radius: 14px; border: {{ r1 }}; box-sizing: border-box"></span>
</button>

<button type="button" onClick="{{ pick2 }}" aria-pressed="{{ p2 }}" style="min-height: 64px; padding: 8px 12px; border: {{ b2 }}; border-radius: 16px; background: {{ f2 }}; font-family: inherit; color: #1F1B16; display: flex; align-items: center; gap: 12px; text-align: left; cursor: pointer; box-sizing: border-box">
<span style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 12px; background: #EEF3F8; color: #234A70; display: flex; flex-direction: column; align-items: center; justify-content: center"><span style="font-size: 20px; font-weight: 700; line-height: 1">23</span><span style="font-size: 12px; font-weight: 700">SEP</span></span>
<span style="display: flex; flex-direction: column; gap: 1px; flex-grow: 1">
<span style="font-size: 20px; font-weight: 700">Building the house</span>
<span style="font-size: 16px; color: #5E574E">yesterday · Maxim</span>
</span>
<span style="width: 28px; height: 28px; flex-shrink: 0; border-radius: 14px; border: {{ r2 }}; box-sizing: border-box"></span>
</button>

<div style="border: {{ b3 }}; border-radius: 16px; background: {{ f3 }}; display: flex; flex-direction: column; box-sizing: border-box; margin-top: 4px">
<button type="button" onClick="{{ pick3 }}" aria-pressed="{{ p3 }}" style="min-height: 60px; padding: 8px 12px; border: none; background: transparent; font-family: inherit; color: #1F1B16; display: flex; align-items: center; gap: 12px; text-align: left; cursor: pointer">
<span style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 12px; background: #1F1B16; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></span>
<span style="font-size: 20px; font-weight: 700; flex-grow: 1">New event</span>
<span style="width: 28px; height: 28px; flex-shrink: 0; border-radius: 14px; border: {{ r3 }}; box-sizing: border-box"></span>
</button>
<sc-if value="{{ isNew }}" hint-placeholder-val="{{ true }}">
<div style="padding: 0 12px 12px 12px; display: flex; flex-direction: column; gap: 8px">
<div style="background: #FFFFFF; border-radius: 12px; padding: 8px 12px; display: flex; align-items: center; gap: 10px; border: 1px solid #E4DACB">
<span style="display: flex; flex-direction: column; flex-grow: 1">
<span style="font-size: 15px; font-weight: 700; color: #5E574E">Title</span>
<span style="font-size: 20px; font-weight: 700">Garden harvest</span>
</span>
<button type="button" aria-label="Say the title" style="width: 48px; height: 48px; flex-shrink: 0; border: none; border-radius: 24px; background: #A34A24; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0"></path><path d="M12 18v3"></path></svg></button>
</div>
<div style="background: #FFFFFF; border-radius: 12px; padding: 8px 12px; display: flex; align-items: center; gap: 10px; border: 1px solid #E4DACB">
<span style="display: flex; flex-direction: column; flex-grow: 1">
<span style="font-size: 15px; font-weight: 700; color: #5E574E">Date · from photos</span>
<span style="font-size: 20px; font-weight: 700">Today, September 24</span>
</span>
<button type="button" style="min-height: 48px; padding: 0 12px; border: none; border-radius: 24px; background: #F7F3EC; color: #A34A24; font-family: inherit; font-size: 17px; font-weight: 700; cursor: pointer">Edit</button>
</div>
</div>
</sc-if>
</div>
</div>

<div style="padding: 10px 16px 28px 16px; display: flex; flex-direction: column; gap: 2px; border-top: 1px solid #E4DACB; background: #F7F3EC">
<a href="PhotoSend.dc.html" style="min-height: 64px; background: #1F1B16; color: #FFFFFF; border-radius: 32px; font-size: 22px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none">
<span>Next</span>
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
</a>
<a href="PhotoSend.dc.html" style="min-height: 52px; display: flex; align-items: center; justify-content: center; font-size: 19px; font-weight: 700; text-decoration: none; color: #A34A24">No event, just photos</a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const sel = s.sel ?? 3;
    const v = { isNew: sel === 3 };
    [0, 1, 2, 3].forEach((i) => {
      const on = sel === i;
      v['p' + i] = on ? 'true' : 'false';
      v['b' + i] = on ? '3px solid #A34A24' : '2px solid #E4DACB';
      v['f' + i] = on ? '#FBEFE7' : '#FFFFFF';
      v['r' + i] = on ? '9px solid #A34A24' : '2px solid #C9BBA6';
      v['pick' + i] = () => this.setState({ sel: i });
    });
    return v;
  }
}
</script>
</body>
</html>
